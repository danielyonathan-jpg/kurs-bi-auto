name: Update KTBI

on:
  schedule:
    # Berjalan jam 09:12 WIB (02:12 UTC) Senin - Jumat
    - cron: '12 0 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install cloudscraper requests beautifulsoup4

      - name: Run Scraper KTBI
        run: python scraper.py
