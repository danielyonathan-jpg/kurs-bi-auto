name: Update Kurs Transaksi BI

on:
  schedule:
    # Otomatis berjalan setiap hari Senin-Jumat pukul 09:00 WIB (02:00 UTC)
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install cloudscraper requests

      - name: Run Scraper
        run: python scraper.py
